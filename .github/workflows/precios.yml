name: Actualizar precios VOO
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - name: Descargar precios
        run: |
          python - <<'EOF'
          import yfinance as yf, json
          d = yf.download("VOO", start="2026-01-01", auto_adjust=False, progress=False)
          if d.columns.nlevels > 1:
              d = d.droplevel(1, axis=1)
          s = d["Adj Close"].dropna()
          if len(s) < 100:
              raise SystemExit("Pocos datos: no se actualiza")
          json.dump({k.strftime("%Y-%m-%d"): round(float(v), 4) for k, v in s.items()}, open("prices.json", "w"))
          EOF
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Actualizar precios VOO" && git push)
